[project]
name = "triage"
version = "0.1.0"
description = "LLM agent that triages security scanner findings with human-in-the-loop approval"
readme = "README.md"
authors = [
    { name = "sultan", email = "hosediasov@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, B: bugbear (likely bugs),
# UP: pyupgrade (modern syntax), SIM: simplifications.
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
# Relax per third-party library via [[tool.mypy.overrides]] when needed,
# never globally.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
